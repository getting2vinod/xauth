[project]
name = "xauth"
version = "0.1.0"
description = "FastAPI Nginx auth_request service with Google Sheets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.1",
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
    "passlib[bcrypt]>=1.7.4",
]