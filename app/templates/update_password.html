<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - XAuth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f9fc;
            --text-dark: #3a3a3a;
            --placeholder-color: #7f8fa4;
            --input-bg: #e0e6ed;
            --input-border: #ced4da;
            --btn-blue: #4085c1;
            --btn-blue-hover: #336da1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 380px;
            padding: 2.5rem 2rem;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 500;
            text-align: center;
            color: var(--text-dark);
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: bold;
            color: #000000;
            margin-bottom: 0.25rem;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            padding: 0.6rem 0.75rem;
        }

        .btn-login {
            background-color: var(--btn-blue);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 0.6rem;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 1rem;
            transition: background-color 0.2s ease;
        }

        .btn-login:hover {
            background-color: var(--btn-blue-hover);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="login-title">Set Password</h1>
        <p class="text-muted text-center small mb-3">First time login detected for <strong>{{ username }}</strong></p>
        <p class="text-muted text-center small mb-3">On successful completion, login screen will be displayed.</p>
        
        {% if error %}
            <div class="alert alert-danger text-center" role="alert">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/{{ ROUTE_PATH }}/update-password">
            <input type="hidden" name="next" value="{{ next }}">
            <input type="hidden" name="username" value="{{ username }}">
            
            <div class="mb-3">
                <label for="password" class="form-label">New Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter new password" required>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required>
            </div>

            <button type="submit" class="btn btn-login">Update & Continue</button>
        </form>
    </div>
</body>
</html>
